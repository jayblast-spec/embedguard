<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="858" height="258" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">embedguard: catching a silent embedding-model swap</text>

  <!-- Step 1 -->
  <rect x="30" y="70" width="180" height="80" rx="8" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="120" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#0b3d91">1. Build index</text>
  <text x="120" y="116" text-anchor="middle" font-size="11" fill="#334">embed canaries with</text>
  <text x="120" y="130" text-anchor="middle" font-size="11" fill="#334">current model, store</text>
  <text x="120" y="144" text-anchor="middle" font-size="11" fill="#334">as fingerprint</text>

  <path d="M210 110 H255" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="255" y="70" width="180" height="80" rx="8" fill="#fff7e6" stroke="#d4a017"/>
  <text x="345" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5200">2. Time passes</text>
  <text x="345" y="116" text-anchor="middle" font-size="11" fill="#334">provider swaps model</text>
  <text x="345" y="130" text-anchor="middle" font-size="11" fill="#334">version silently --</text>
  <text x="345" y="144" text-anchor="middle" font-size="11" fill="#334">no error, no log</text>

  <path d="M435 110 H480" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="480" y="70" width="190" height="80" rx="8" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="575" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#0b3d91">3. checkDrift()</text>
  <text x="575" y="116" text-anchor="middle" font-size="11" fill="#334">re-embed the exact</text>
  <text x="575" y="130" text-anchor="middle" font-size="11" fill="#334">canary probes, compare</text>
  <text x="575" y="144" text-anchor="middle" font-size="11" fill="#334">cosine similarity</text>

  <path d="M670 110 H710" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Outcome -->
  <rect x="710" y="60" width="130" height="45" rx="7" fill="#ffebe9" stroke="#cf222e"/>
  <text x="775" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="#82071e">drift: alert</text>

  <rect x="710" y="115" width="130" height="45" rx="7" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="775" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#116329">stable: ok</text>

  <text x="430" y="200" text-anchor="middle" font-size="11" fill="#57606a">Dimension checks alone miss same-dimension model swaps -- similarity on fixed canary probes catches them.</text>
  <text x="430" y="222" text-anchor="middle" font-size="11" fill="#57606a">Zero runtime dependencies. You bring the embeddings; embedguard does the math.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
